info:
  name: /api/download/{APID}{APTitle}
  type: http
  seq: 2

http:
  method: POST
  url: https://{{ZONTAL_HOST}}/api/download/
  headers:
    - name: Authorization
      value: Bearer {{zontal_access_token}}
  body:
    type: json
    data: |
      {
        "title": "00237_NIR005_G017_water_S0995945_S01.001.asm",
        "informationPackage": [
          {
            "identifier": "247d49949d9945a8a1ed7bcc5c986c"
          }
        ],
        "digitalObjectsOnly": true
      }
  auth:
    type: bearer
    token: "{{zontal_access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const disposition = res.headers["content-disposition"];
        let filename;

        if (disposition) {
          const match = disposition.match(/filename="?([^"]+)"?/);
          if (match) {
            filename = match[1];
          }
        }

        console.log(`Downloaded ${filename}`);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
