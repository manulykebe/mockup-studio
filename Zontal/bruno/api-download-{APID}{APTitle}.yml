info:
  name: /api/download/{APID}{APTitle}
  type: http
  seq: 2

http:
  method: POST
  url: https://{{ZONTAL_HOST}}/api/download/
  headers:
    - name: Authorization
      value: Bearer {{zontal_access_token}}
  body:
    type: json
    data: |-
      {
          "title": "Zontal testing- D9838-33-7.csv.asm", // title is required but can be anything
          "informationPackage": [
              {
                  "identifier": "0d16c7b52519459da6e6a3e3da73ad"
              }
          ],
          "digitalObjectsOnly": true
      }
  auth:
    type: bearer
    token: "{{zontal_access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const disposition = res.headers["content-disposition"];
        let filename;

        if (disposition) {
          const match = disposition.match(/filename="?([^"]+)"?/);
          if (match) {
            filename = match[1];
          }
        }

        console.log(`Downloaded ${filename}`);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
