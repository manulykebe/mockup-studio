runtime:
  scripts:
    - type: before-request
      code: |-
        (function () {
          const qas = 'Zontal testing- D9838-1-19.csv.asm|0d16c7b52519459da6e6a3e3da73ad,Zontal testing- D9838-33-6.csv.asm|15dc8cde0e38444e9d9369d6dcf20e'; // <-- paste full QAS here
          const idx = 0; // change as needed

          const items = qas.split(',').map(s => s.trim()).filter(Boolean);
          const selected = items[idx] || '';
          const [title = '', id = ''] = selected.split('|').map(s => s.trim());

          console.log('Computed IPID =', id);
          console.log('Computed IPTitle =', title);
        })();
    - type: after-response
      code: |-
        const disposition = res.headers["content-disposition"];
        let filename;

        if (disposition) {
          const match = disposition.match(/filename="?([^"]+)"?/);
          if (match) {
            filename = match[1];
          }
        }

        console.log(`Downloaded ${filename}`);

