info:
  name: /api/search/informationPackages/  {fileName's}{instrumentId's} copy
  type: http
  seq: 9

http:
  method: POST
  url: https://{{ZONTAL_HOST}}/api/search/informationPackages/
  body:
    type: json
    data: |-
      {
          "size": 25,
          "query": "",
          "filter": [
              {
                  "propertyName": "lifecycleStatus",
                  "value": [
                      "Submitted",
                      "Archived"
                  ],
                  "filterType": "terms",
                  "operator": null
              },
              {
                  "propertyName": "title",
                  "value": [
                      "00237_NIR005"
                  ],
                  "filterType": "prefix",
                  "operator": null
              },
              {
                  "propertyName": "informationPackageProfile",
                  "value": [
                      "VNF"
                  ],
                  "filterType": "wildcard",
                  "operator": null
              }
          ],
          "sortField": [
              "createdOn"
          ],
          "sortOrder": [
              "asc"
          ]
      }
  auth:
    type: bearer
    token: "{{zontal_access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setEnvVar('reccount', res.getBody().member?.length);
        console.log('Record count:', res.getBody().member?.length);

        if (res.getBody().member?.length || 0 === 1) {
            bru.setEnvVar('IPID', res.getBody().member[0].objectKey[0])
        }
        if (res.getBody().member?.length || 0 === 1) {
            bru.setEnvVar('IPTitle', res.getBody().member[0].title)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
